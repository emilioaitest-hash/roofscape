name: Release

# Merging to main is what publishes an update. The running app finds it within
# half an hour, downloads it quietly, and offers a restart. See decision 0012.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The draft is made once, here, before any builder runs.
  #
  # It used to be made by whichever platform got there first, and a draft has no
  # git tag behind it — so GitHub happily accepts several drafts with the same
  # tag name and the three builders each made their own. The macOS disk image
  # and the Windows installer landed in different releases, and somebody on a
  # Mac was offered a .exe.
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          BASE=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Open the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pick.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes "Built from ${{ github.sha }}."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: npm install --no-audit --no-fund
      - run: npm run build

      # Uploads into the draft that already exists, rather than making one.
      - name: Build and publish the app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nothing is signed yet. Without this, electron-builder looks for a
          # certificate on macOS, finds none, and fails the build rather than
          # producing the unsigned app we actually want for now.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -w @app/desktop -- --publish always

  # A draft is invisible to the updater and to the download page. Undrafting
  # once, after every platform has uploaded, is what stops an update going out
  # with only some of its downloads attached.
  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.draft.outputs.tag }}" --draft=false --latest
